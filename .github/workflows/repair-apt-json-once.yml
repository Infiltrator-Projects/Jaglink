name: Repair JAGLINK APT JSON handling once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Replace jq-only APT verification with Python stdlib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          payload_hits = [i for i, line in enumerate(lines) if 'payload="$(jq -nc --arg repository' in line]
          assert len(payload_hits) == 1, f'unexpected jq payload line count: {len(payload_hits)}'
          i = payload_hits[0]
          assert i + 1 < len(lines) and 'event_type:"application-release"' in lines[i + 1]
          indent = lines[i][:-len(lines[i].lstrip())]
          new_payload = """payload="$(python3 -c 'import json, os; print(json.dumps({"event_type":"application-release","client_payload":{"repository":os.environ["GITHUB_REPOSITORY"],"sha":os.environ["RELEASE_SHA"]}}, separators=(",", ":")))')"\n"""
          lines[i:i + 2] = [indent + new_payload]

          check_hits = [i for i, line in enumerate(lines) if '| jq -e --arg id "$APP_ID"' in line]
          assert len(check_hits) == 1, f'unexpected jq catalogue line count: {len(check_hits)}'
          i = check_hits[0]
          assert i + 1 < len(lines) and '.[] | select(.id == $id and .version == $version)' in lines[i + 1]
          indent = lines[i][:-len(lines[i].lstrip())]
          new_check = """| python3 -c 'import json, os, sys; apps=json.load(sys.stdin); raise SystemExit(0 if any(str(app.get("id", "")) == os.environ["APP_ID"] and str(app.get("version", "")) == os.environ["VERSION"] for app in apps) else 1)'; then\n"""
          lines[i:i + 2] = [indent + new_check]

          text = ''.join(lines)
          assert 'payload="$(jq -nc' not in text
          assert '| jq -e --arg id "$APP_ID"' not in text
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/repair-apt-json-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'Make JAGLINK APT verification runner-independent'
          git push origin HEAD:main
