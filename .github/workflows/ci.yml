# SPDX-License-Identifier: GPL-3.0-or-later
name: JAGLINK CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux-native, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify dependency ownership and exact recursive gitlinks
        shell: bash
        run: |
          set -euo pipefail
          gitlinks="$(git ls-files --stage | awk '$1 == "160000" { print $4 }' | sort)"
          test "$gitlinks" = "src/link"
          test ! -e src/infiltratr-common
          status="$(git submodule status --recursive)"
          if grep -Eq '^[+-U]' <<<"$status"; then
            printf '%s\n' "$status" >&2
            echo 'Recursive submodule checkout does not match the committed gitlinks.' >&2
            exit 1
          fi
          test -f src/link/VERSION
          test -f src/link/src/infiltratr-common/VERSION
          grep -q 'src/uds/uds_services.c' src/link/CMakeLists.txt
          grep -q 'link_uds_standard_service_count' src/link/src/uds/uds_services.c
          grep -Fq '#include "../link/src/uds/uds_services.c"' src/uds/uds.c
          grep -Fq '#include "../link/src/uds/uds_server.c"' src/uds/uds.c
          grep -q 'link_elm327_parser_feed' src/link/src/elm327/elm327.c
          grep -q 'link_obd2_decode_live_pid' src/link/src/obd2/obd2.c
          grep -q 'link_uds_decode_response' src/link/src/uds/uds.c
          grep -q 'link_diagnostic_flow_next_action' src/link/src/core/diagnostic_flow.c
          grep -q 'return link_elm327_parser_feed' src/elm327/elm327.c
          grep -q 'link_diagnostic_flow_accept_response' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'link_telemetry_recorder_continue' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'LinkProbeTimeoutSeconds = 5.0' src/link/platform/apple/LinkBLETransport.m
          grep -q 'LinkDiagnosticsController' platform/apple/JagLinkDiagnosticsController.m
          grep -Fq '#include "../link/src/core/diagnostic_capability.c"' src/core/jaglink.c
          grep -Fq 'LinkTaskTile(.vehicle)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.errors)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.table)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.graph)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.tests)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.services)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkDiagnosticAboutButton' app/ios/JAGLINK/JAGLINKApp.swift
          grep -Fq 'LinkDiagnosticAboutView' app/ios/JAGLINK/JAGLINKApp.swift
          grep -Fq 'descriptor.about = &about_info;' app/linux/main.c
          test ! -e app/linux/about-dialog.c
          test ! -e app/linux/about-dialog.h
          ! grep -Fq 'JagHomeTile("OBD"' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'diagnosticCapabilityText = controller.diagnosticCapabilityText' app/ios/JAGLINK/ConnectionViewModel.swift
          grep -Fq 'return _shared.standardLiveValueRows;' platform/apple/JagLinkDiagnosticsController.m
          grep -q 'src/core/diagnostic_flow.c' src/core/jaglink.c
          ! grep -q 'JagLinkDiagnosticsPhase' platform/apple/JagLinkDiagnosticsController.m
          test "$(wc -c < src/obd2/obd2.c)" -lt 1024
          test "$(wc -c < src/uds/uds.c)" -lt 2048
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Local Linux / ASan + UBSan
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DJAGLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  linux-app:
    name: Linux / GTK4 + DEB + RUN
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config xvfb
        if: runner.environment == 'github-hosted'
      - name: Bootstrap libusb development files for self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if pkg-config --exists libusb-1.0; then
            exit 0
          fi
          root="$RUNNER_TEMP/libusb-dev"
          dl="$RUNNER_TEMP/libusb-download"
          rm -rf "$root" "$dl"
          mkdir -p "$root" "$dl"
          cd "$dl"
          apt-get download libusb-1.0-0 libusb-1.0-0-dev
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root"
          done
          pc="$(find "$root/usr/lib" -path '*/pkgconfig/libusb-1.0.pc' -print -quit)"
          test -n "$pc"
          sed -i "s|^prefix=/usr$|prefix=$root/usr|" "$pc"
          libdir="$(dirname "$(dirname "$pc")")"
          echo "PKG_CONFIG_PATH=$(dirname "$pc")${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Bootstrap Xvfb for self-hosted Linux
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1 && command -v Xvfb >/dev/null 2>&1; then
            exit 0
          fi
          root="$RUNNER_TEMP/xvfb-root"
          dl="$RUNNER_TEMP/xvfb-download"
          rm -rf "$root" "$dl"
          mkdir -p "$root" "$dl"
          cd "$dl"
          apt-get download xvfb xserver-common xauth libxfont2
          for deb in ./*.deb; do
            dpkg-deb -x "$deb" "$root"
          done
          test -x "$root/usr/bin/xvfb-run"
          test -x "$root/usr/bin/Xvfb"
          echo "$root/usr/bin" >> "$GITHUB_PATH"
          libdir="$root/usr/lib/x86_64-linux-gnu"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DJAGLINK_BUILD_LINUX_APP=ON -DJAGLINK_BUILD_PROFILE=generic -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Verify native Tactrix provider is linked
        shell: bash
        run: |
          set -euo pipefail
          ldd ./build-linux/jaglink | grep -F 'libusb-1.0.so' >/dev/null
          grep -aF 'OP2:Tactrix OpenPort 2.0' ./build-linux/jaglink >/dev/null
      - name: Stress disconnected sidebar navigation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/navigation-stress.log"
          GTK_A11Y=none G_DEBUG=fatal-warnings timeout 40s xvfb-run -a ./build-linux/jaglink --ui-navigation-stress | tee "$log"
          grep -Fq 'LINK GTK timed navigation stress verified:' "$log"
          grep -Fq 'sidebar selections while disconnected with main-loop interleaving' "$log"
      - name: Verify deterministic Linux emblem, About and shared diagnostics
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--manual-register' CMakeLists.txt
          grep -q 'jaglink_linux_resources_register_resource' app/linux/main.c
          grep -q 'gtk_image_new_from_resource' src/link/platform/linux/link-gtk-shell.c
          grep -q 'link_diagnostic_flow_start' src/link/platform/linux/link-gtk-shell.c
          grep -q 'link_elm327_session_begin' src/link/platform/linux/link-gtk-shell.c
          grep -q 'diagnostic_changed' app/linux/main.c
          if grep -Eq '\.link-(connection-bar|device-row|adapter-combo|toolbar-button|link-button|save-session-button|card|status-chip)[^{]*\{[^}]*((min|max)-(width|height)|padding|border-radius)' app/linux/main.c; then
            echo 'Shared Linux shell geometry must come from LINK, not JAGLINK CSS.' >&2
            exit 1
          fi
          if grep -Fq 'adapter_combo_width' app/linux/main.c src/link/platform/linux/link-gtk-shell.h; then
            echo 'Adapter-selector width must be LINK-owned.' >&2
            exit 1
          fi
          grep -Fq 'gtk_widget_set_hexpand(shell->device_combo, TRUE);' src/link/platform/linux/link-gtk-shell.c
          grep -Fq 'Xavier Wheaton' app/linux/main.c
          grep -Fq 'Shannon Smith' app/linux/main.c
          grep -Fq 'Generic / APT package' app/linux/main.c
          grep -Fq 'Native / local machine compile' app/linux/main.c
          grep -Fq 'link_gtk_show_about' src/link/platform/linux/link-gtk-about.c
          test -s app/linux/assets/jaglink-emblem.png
      - name: Package DEB and native RUN
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb_src="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_src"
          dpkg-deb -c "$deb_src" | grep -F './usr/lib/udev/rules.d/60-jaglink-openport2.rules' >/dev/null
          dpkg-deb -c "$deb_src" | grep -F './usr/share/doc/jaglink/copyright' >/dev/null
          dpkg-deb -f "$deb_src" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          install -m 0644 "$deb_src" "$RUNNER_TEMP/release/JAGLINK-${VERSION}-linux-amd64.deb"
          bash scripts/build-linux-run.sh "$RUNNER_TEMP/release"
          "$RUNNER_TEMP/release/JAGLINK-${VERSION}-linux-native.run" --help >/dev/null
          native_deb="$RUNNER_TEMP/jaglink_${VERSION}+native1_amd64.deb"
          "$RUNNER_TEMP/release/JAGLINK-${VERSION}-linux-native.run" --build-only --output "$native_deb"
          test "$(dpkg-deb -f "$native_deb" Package)" = jaglink
          test "$(dpkg-deb -f "$native_deb" Version)" = "${VERSION}+native1"
          dpkg-deb -c "$native_deb" | grep -F './usr/lib/udev/rules.d/60-jaglink-openport2.rules' >/dev/null
          dpkg-deb -f "$native_deb" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          dpkg --compare-versions "${VERSION}+native1" gt "${VERSION}"
          test -s "$RUNNER_TEMP/release/JAGLINK-${VERSION}-linux-amd64.deb"
          test -s "$RUNNER_TEMP/release/JAGLINK-${VERSION}-linux-native.run"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-linux-packages
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-discover:
    name: Windows / JAGLINK Discover launch-verified
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify shared modern Windows shell and canonical icon source
        shell: pwsh
        run: |
          $icon = 'app/ios/JAGLINK/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png'
          if (-not (Test-Path $icon)) { throw 'Canonical JAGLINK AppIcon PNG is missing' }
          $ui = 'src/link/platform/windows/link-discover-ui.c'
          foreach ($needle in @('create_main_menu','IDM_HELP_ABOUT','InitCommonControlsEx','LINK_PRODUCT_WEBSITE')) {
            if (-not (Select-String -Path $ui -SimpleMatch $needle -Quiet)) { throw "Missing shared Windows feature: $needle" }
          }
          $about = 'src/link/platform/windows/link-windows-about.c'
          foreach ($needle in @('link_windows_show_about','TaskDialogIndirect')) {
            if (-not (Select-String -Path $about -SimpleMatch $needle -Quiet)) { throw "Missing shared Windows About feature: $needle" }
          }
          if (-not (Test-Path 'src/link/platform/windows/smoke-launch.ps1')) { throw 'Missing launch smoke test' }
          if (Test-Path 'app/windows/jaglink.ico') { throw 'Independent JAGLINK ICO must not be maintained' }
          if (Test-Path 'app/windows/jaglink.rc') { throw 'Independent JAGLINK RC must not be maintained' }
      - name: Configure Win32 build
        shell: pwsh
        run: cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - name: Build JAGLINK Discover
        shell: pwsh
        run: cmake --build build-win32 --config Release --target jaglink-discover --parallel
      - name: Reject dynamic Visual C++ runtime dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is unavailable' }
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe' | Select-Object -First 1)
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) { throw 'Unable to locate dumpbin.exe' }
          $deps = (& $dumpbin /DEPENDENTS build-win32/Release/jaglink-discover.exe | Out-String)
          Write-Host $deps
          foreach ($dll in @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','ucrtbased.dll')) {
            if ($deps -match [regex]::Escape($dll)) { throw "Unexpected dynamic runtime dependency: $dll" }
          }
      - name: Prove the EXE launches
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/jaglink-discover.exe' -ExpectedTitle 'JAGLINK Discover'
      - name: Verify embedded version metadata and icon
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build-win32/Release/jaglink-discover.exe').Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Wrong ProductVersion: $($info.ProductVersion)" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Executable has no associated icon' }
          $icon.Dispose()
      - name: Stage Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item build-win32/Release/jaglink-discover.exe "release-assets/JAGLINK-${{ steps.version.outputs.version }}-windows-discover.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-windows-discover
          path: release-assets/JAGLINK-${{ steps.version.outputs.version }}-windows-discover.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  apple-ios:
    name: iOS / Xcode / ${{ matrix.configuration }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          project_versions="$(grep -E '^[[:space:]]*MARKETING_VERSION = ' app/ios/JAGLINK.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/' | sort -u)"
          test "$project_versions" = "$version"
          status="$(git submodule status --recursive)"
          ! grep -Eq '^[+-U]' <<<"$status"
          grep -Fq '#include "../link/src/uds/uds_services.c"' src/uds/uds.c
          grep -q 'link_diagnostic_flow_accept_response' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'LinkDiagnosticsController' platform/apple/JagLinkDiagnosticsController.m
          grep -Fq 'LinkTaskTile(.vehicle)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.errors)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.table)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.graph)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.tests)' app/ios/JAGLINK/ContentView.swift
          grep -Fq 'LinkTaskTile(.services)' app/ios/JAGLINK/ContentView.swift
          ! grep -Fq 'JagHomeTile("OBD"' app/ios/JAGLINK/ContentView.swift
          grep -Fq '#define JAGLINK_WORKSPACE_OBD LINK_WORKSPACE_OBD' include/jaglink/jaglink.h
          grep -q 'didReceiveFlowEvent' platform/apple/JagLinkDiagnosticsController.m
          grep -q 'didReceiveFlowEvent' src/link/platform/apple/LinkDiagnosticsController.m
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          grep -Fq "#define LINK_VERSION_STRING \"$link_version\"" src/link/include/link/version.h
          grep -Fq '#define JAGLINK_EMBEDDED_LINK_REVISION' src/core/jaglink.c
          link_gitlink="$(git ls-tree HEAD src/link | awk '{print $3}')"
          test -n "$link_gitlink"
          grep -Fq "\"$link_gitlink\"" src/core/jaglink.c
          grep -Fq '.source_id = "Infiltrator-Projects/Jaglink"' src/core/jaglink.c
          grep -Fq '#include "../link/src/core/diagnostic_request.c"' src/core/jaglink.c
          grep -Fq '#include "../link/src/core/mercedes_me_diagnostic.c"' src/core/jaglink.c
          grep -Fq '#include "../link/src/kwp2000/kwp2000.c"' src/core/jaglink.c
          grep -Fq '#include "link/version.h"' src/link/src/core/telemetry.c
          ! grep -Fq 'LINK_TELEMETRY_LINK_VERSION' src/link/src/core/telemetry.c
          ! grep -Fq '"0.14.26"' src/link/src/core/telemetry.c
          grep -Fq 'Xavier Wheaton' app/ios/JAGLINK/JAGLINKApp.swift
          grep -Fq 'Shannon Smith' app/ios/JAGLINK/JAGLINKApp.swift
      - name: Build simulator
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/JAGLINK.xcodeproj -scheme JAGLINK -configuration "${{ matrix.configuration }}" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" JAGLINK_SOURCE_REVISION="$GITHUB_SHA" build

  iphone-device-ipa:
    name: iPhone / unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build IPA
        shell: bash
        run: bash scripts/build-ios-ipa.sh
      - name: Stage exact IPA name
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ipa="dist/JAGLINK-${VERSION}-unsigned.ipa"
          test -s "$ipa"
          cp "$ipa" "$RUNNER_TEMP/JAGLINK-${VERSION}-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/JAGLINK-${VERSION}-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/JAGLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish complete atomic release
    needs: [portable-core, sanitizers, linux-app, windows-discover, apple-ios, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: [self-hosted, Linux, X64, linux-native]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          common_version="$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            echo "Release commit subject must begin with Release ${version}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "link_version=$link_version" >> "$GITHUB_OUTPUT"
          echo "common_version=$common_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: JAGLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: JAGLINK-${{ steps.release.outputs.version }}-linux-packages
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: JAGLINK-${{ steps.release.outputs.version }}-windows-discover
          path: release-assets
      - name: Verify release artifacts and build checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "JAGLINK-${VERSION}-unsigned.ipa" \
            "JAGLINK-${VERSION}-linux-amd64.deb" \
            "JAGLINK-${VERSION}-linux-native.run" \
            "JAGLINK-${VERSION}-windows-discover.exe"; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum JAGLINK-* > SHA256SUMS.txt)
      - name: Stage complete draft and publish exact immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LINK_VERSION: ${{ steps.release.outputs.link_version }}
          COMMON_VERSION: ${{ steps.release.outputs.common_version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          release_state="$(gh release view "$TAG" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' \
            2>/dev/null || true)"
          if [[ -n "$release_state" ]]; then
            IFS=$'\t' read -r is_draft target_commitish <<<"$release_state"
            if [[ "$is_draft" != "true" || "$target_commitish" != "$GITHUB_SHA" ]]; then
              echo "Release $TAG already exists; published releases are immutable." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "JAGLINK $VERSION" \
              --notes "JAGLINK $VERSION: complete launch-verified release on LINK $LINK_VERSION and Infiltratr Common $COMMON_VERSION, with the shared C11 diagnostic-flow controller, OBD-II/UDS/CAN-FD engines, deterministic Linux branding, static Windows runtime and shared Windows Discover shell."
          fi
          gh release upload "$TAG" release-assets/* --clobber
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for expected in \
            "JAGLINK-${VERSION}-unsigned.ipa" \
            "JAGLINK-${VERSION}-linux-amd64.deb" \
            "JAGLINK-${VERSION}-linux-native.run" \
            "JAGLINK-${VERSION}-windows-discover.exe" \
            "SHA256SUMS.txt"; do
            grep -Fxq "$expected" <<<"$assets"
          done
          gh release edit "$TAG" --draft=false
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"

      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          APP_ID: jaglink
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository's five-minute safety refresh."
            fi
          else
            echo "::warning::Immediate APT dispatch token is unavailable; waiting for the repository's five-minute safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::GitHub release was published, but the central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
