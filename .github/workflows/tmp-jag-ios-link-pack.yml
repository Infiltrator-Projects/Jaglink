name: Temporary JAGLINK iOS LINK source fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-jag-ios-link-pack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire language pack source and clean helper
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/ios/JAGLINK.xcodeproj/project.pbxproj')
          s = p.read_text(encoding='utf-8')

          build_anchor = '\t\tD2A900000000000000000007 /* link_i18n_platform.c in Sources */ = {isa = PBXBuildFile; fileRef = D2A900000000000000000009 /* link_i18n_platform.c */; };'
          build_line = '\t\tD2A900000000000000000010 /* language_pack.c in Sources */ = {isa = PBXBuildFile; fileRef = D2A900000000000000000011 /* language_pack.c */; };'
          if build_line not in s:
              if build_anchor not in s: raise RuntimeError('build anchor missing')
              s = s.replace(build_anchor, build_anchor + '\n' + build_line, 1)

          ref_anchor = '\t\tD2A900000000000000000009 /* link_i18n_platform.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; name = link_i18n_platform.c; path = "../../src/link/src/core/i18n_platform.c"; sourceTree = SOURCE_ROOT; };'
          ref_line = '\t\tD2A900000000000000000011 /* language_pack.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; name = language_pack.c; path = "../../src/link/src/core/language_pack.c"; sourceTree = SOURCE_ROOT; };'
          if ref_line not in s:
              if ref_anchor not in s: raise RuntimeError('file-ref anchor missing')
              s = s.replace(ref_anchor, ref_anchor + '\n' + ref_line, 1)

          source_anchor = '\t\t\t\tD2A900000000000000000007 /* link_i18n_platform.c in Sources */,'
          source_line = '\t\t\t\tD2A900000000000000000010 /* language_pack.c in Sources */,'
          if source_line not in s:
              if source_anchor not in s: raise RuntimeError('sources anchor missing')
              s = s.replace(source_anchor, source_anchor + '\n' + source_line, 1)

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-jag-ios-link-pack.yml
          git diff --check
          git add -A
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git commit -m "Wire LINK language-pack source into JAGLINK iOS bridge"
          git push origin HEAD:main
