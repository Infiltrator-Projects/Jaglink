name: JAGLINK standalone conversion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    if: github.repository == 'The-First-Infiltrator/Jaglink'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JAGLINK
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Convert to standalone source tree
        shell: bash
        run: |
          set -euo pipefail

          if ! git ls-files --stage upstream/mblink | grep -q .; then
            echo 'JAGLINK is already standalone.'
            exit 0
          fi

          git config user.name 'The-First-Infiltrator'
          git config user.email 'infiltratr@yandex.com'

          source_dir="$RUNNER_TEMP/mblink-source"
          git clone --quiet https://github.com/The-First-Infiltrator/MBLINK.git "$source_dir"
          git -C "$source_dir" checkout --quiet e760b6ec05897c87e3531d68649b121403fcdec8

          mkdir -p src/core src/elm327 src/obd2 src/uds include/mblink platform/apple tests docs

          rsync -a --exclude='mblink.c' "$source_dir/src/core/" src/core/
          rsync -a "$source_dir/src/elm327/" src/elm327/
          rsync -a "$source_dir/src/obd2/" src/obd2/
          rsync -a "$source_dir/src/uds/" src/uds/
          rsync -a --exclude='mblink.h' --exclude='mercedes.h' "$source_dir/include/mblink/" include/mblink/
          cp "$source_dir/platform/apple/MBLinkBLETransport.h" platform/apple/
          cp "$source_dir/platform/apple/MBLinkBLETransport+MBLINK.h" platform/apple/
          cp "$source_dir/platform/apple/MBLinkBLETransport.m" platform/apple/
          rsync -a --exclude='test_mercedes*' "$source_dir/tests/" tests/
          cp "$source_dir/LICENSE" LICENSE

          git rm -f upstream/mblink
          rm -rf upstream
          git rm -f .gitmodules

          git submodule add --force https://github.com/The-First-Infiltrator/Infiltrator-Libraries.git src/infiltratr-common
          git -C src/infiltratr-common checkout --quiet 182e64cb8b8992879e443b941565058166fe0161

          cat > CMakeLists.txt <<'CMAKE'
          # SPDX-License-Identifier: GPL-3.0-or-later
          cmake_minimum_required(VERSION 3.20)

          file(READ "${CMAKE_CURRENT_SOURCE_DIR}/VERSION" JAGLINK_PROJECT_VERSION)
          string(STRIP "${JAGLINK_PROJECT_VERSION}" JAGLINK_PROJECT_VERSION)
          if(NOT JAGLINK_PROJECT_VERSION MATCHES "^[0-9]+\\.[0-9]+\\.[0-9]+$")
              message(FATAL_ERROR "VERSION must contain a semantic major.minor.patch version.")
          endif()

          project(JAGLINK VERSION "${JAGLINK_PROJECT_VERSION}" LANGUAGES C)
          set(CMAKE_C_STANDARD 11)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          set(CMAKE_C_EXTENSIONS OFF)
          set(CMAKE_EXPORT_COMPILE_COMMANDS ON)

          option(JAGLINK_ENABLE_SANITIZERS "Enable AddressSanitizer and UndefinedBehaviorSanitizer" OFF)
          option(JAGLINK_BUILD_LINUX_APP "Build the native GTK4 Linux front end" OFF)

          if(JAGLINK_ENABLE_SANITIZERS)
              if(NOT CMAKE_C_COMPILER_ID MATCHES "GNU|Clang|AppleClang")
                  message(FATAL_ERROR "JAGLINK_ENABLE_SANITIZERS requires GCC or Clang.")
              endif()
              add_compile_options(-fsanitize=address,undefined -fno-omit-frame-pointer)
              add_link_options(-fsanitize=address,undefined)
          endif()

          include(CTest)

          set(JAGLINK_COMMON_DIR "${CMAKE_CURRENT_SOURCE_DIR}/src/infiltratr-common")
          set(JAGLINK_COMMON_VERSION "1.10.0")
          set(JAGLINK_COMMON_COMMIT "182e64cb8b8992879e443b941565058166fe0161")

          if(NOT EXISTS "${JAGLINK_COMMON_DIR}/VERSION")
              message(FATAL_ERROR "Infiltratr Common ${JAGLINK_COMMON_VERSION} is required. Clone with --recurse-submodules or run git submodule update --init --recursive.")
          endif()

          file(READ "${JAGLINK_COMMON_DIR}/VERSION" JAGLINK_COMMON_FOUND_VERSION)
          string(STRIP "${JAGLINK_COMMON_FOUND_VERSION}" JAGLINK_COMMON_FOUND_VERSION)
          if(NOT JAGLINK_COMMON_FOUND_VERSION STREQUAL JAGLINK_COMMON_VERSION)
              message(FATAL_ERROR "Infiltratr Common ${JAGLINK_COMMON_VERSION} is required; found ${JAGLINK_COMMON_FOUND_VERSION}.")
          endif()

          find_program(JAGLINK_GIT_EXECUTABLE git)
          if(JAGLINK_GIT_EXECUTABLE)
              execute_process(COMMAND "${JAGLINK_GIT_EXECUTABLE}" -C "${JAGLINK_COMMON_DIR}" rev-parse HEAD
                  OUTPUT_VARIABLE JAGLINK_COMMON_FOUND_COMMIT
                  OUTPUT_STRIP_TRAILING_WHITESPACE
                  ERROR_QUIET
                  RESULT_VARIABLE JAGLINK_COMMON_COMMIT_RESULT)
              if(JAGLINK_COMMON_COMMIT_RESULT EQUAL 0 AND NOT JAGLINK_COMMON_FOUND_COMMIT STREQUAL JAGLINK_COMMON_COMMIT)
                  message(FATAL_ERROR "Infiltratr Common must be pinned to ${JAGLINK_COMMON_COMMIT}; found ${JAGLINK_COMMON_FOUND_COMMIT}.")
              endif()
          endif()

          set(INFILTRATR_COMMON_BUILD_TESTS OFF CACHE BOOL "Build Infiltratr Common tests" FORCE)
          set(INFILTRATR_COMMON_WARNINGS_AS_ERRORS ON CACHE BOOL "Treat Infiltratr Common warnings as errors" FORCE)
          add_subdirectory("${JAGLINK_COMMON_DIR}" "${CMAKE_CURRENT_BINARY_DIR}/infiltratr-common" EXCLUDE_FROM_ALL)

          add_library(jaglink STATIC
              src/core/mblink.c
              src/core/parameter.c
              src/core/scheduler.c
              src/core/telemetry_store.c
              src/core/telemetry_csv.c
              src/core/isotp.c
              src/elm327/elm327.c
              src/elm327/can.c
              src/elm327/session.c
              src/elm327/probe.c
              src/obd2/obd2.c
              src/uds/uds.c
              src/jaguar/jaguar.c)

          target_include_directories(jaglink PUBLIC "${CMAKE_CURRENT_SOURCE_DIR}/include")
          target_compile_definitions(jaglink PRIVATE MBLINK_VERSION="${PROJECT_VERSION}")
          target_link_libraries(jaglink PUBLIC InfiltratrCommon::Portable)

          set(JAGLINK_WARNING_FLAGS -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes)
          if(CMAKE_C_COMPILER_ID MATCHES "GNU|Clang|AppleClang")
              target_compile_options(jaglink PRIVATE ${JAGLINK_WARNING_FLAGS} -Werror)
          endif()

          if(JAGLINK_BUILD_LINUX_APP)
              if(NOT UNIX OR APPLE)
                  message(FATAL_ERROR "JAGLINK_BUILD_LINUX_APP is supported on Linux only.")
              endif()
              find_package(PkgConfig REQUIRED)
              pkg_check_modules(GTK4 REQUIRED IMPORTED_TARGET gtk4>=4.6)
              add_executable(jaglink-linux app/linux/main.c)
              target_link_libraries(jaglink-linux PRIVATE jaglink PkgConfig::GTK4)
              if(CMAKE_C_COMPILER_ID MATCHES "GNU|Clang")
                  target_compile_options(jaglink-linux PRIVATE ${JAGLINK_WARNING_FLAGS} -Werror)
              endif()
          endif()

          function(jaglink_add_test target source)
              add_executable(${target} ${source})
              target_link_libraries(${target} PRIVATE jaglink)
              if(CMAKE_C_COMPILER_ID MATCHES "GNU|Clang|AppleClang")
                  target_compile_options(${target} PRIVATE ${JAGLINK_WARNING_FLAGS} -Werror)
              endif()
              add_test(NAME ${target} COMMAND ${target})
          endfunction()

          if(BUILD_TESTING)
              jaglink_add_test(jaglink-test-core tests/test_core.c)
              target_compile_definitions(jaglink-test-core PRIVATE MBLINK_TEST_EXPECTED_VERSION="${PROJECT_VERSION}")
              jaglink_add_test(jaglink-test-elm327 tests/test_elm327.c)
              jaglink_add_test(jaglink-test-elm327-can tests/test_elm327_can.c)
              jaglink_add_test(jaglink-test-elm327-session tests/test_elm327_session.c)
              jaglink_add_test(jaglink-test-elm327-probe tests/test_elm327_probe.c)
              jaglink_add_test(jaglink-test-obd2 tests/test_obd2.c)
              jaglink_add_test(jaglink-test-runtime tests/test_runtime.c)
              jaglink_add_test(jaglink-test-parameter tests/test_parameter.c)
              jaglink_add_test(jaglink-test-parameter-store tests/test_parameter_store.c)
              jaglink_add_test(jaglink-test-scheduler-parameters tests/test_scheduler_parameters.c)
              jaglink_add_test(jaglink-test-isotp tests/test_isotp.c)
              jaglink_add_test(jaglink-test-isotp-failed-state tests/test_isotp_failed_state.c)
              jaglink_add_test(jaglink-test-isotp-functional-response tests/test_isotp_functional_response.c)
              jaglink_add_test(jaglink-test-uds tests/test_uds.c)
              jaglink_add_test(jaglink-test-uds-dtc tests/test_uds_dtc.c)
              jaglink_add_test(jaglink-test-jaguar tests/test_jaguar.c)
          endif()
          CMAKE

          python3 <<'PY'
          from pathlib import Path
          p = Path('app/ios/JAGLINK.xcodeproj/project.pbxproj')
          s = p.read_text()
          s = s.replace('../../upstream/mblink/src/infiltratr-common', '../../src/infiltratr-common')
          s = s.replace('$(SRCROOT)/../../upstream/mblink/src/infiltratr-common', '$(SRCROOT)/../../src/infiltratr-common')
          s = s.replace('../../upstream/mblink/', '../../')
          s = s.replace('$(SRCROOT)/../../upstream/mblink/', '$(SRCROOT)/../../')
          p.write_text(s)
          PY

          cat > README.md <<'README'
          # JAGLINK

          JAGLINK is a standalone, C-first Jaguar diagnostics project for the Jaguar X-Type X400 (2001–2009), derived from the proven generic diagnostic foundations that originally powered MBLINK but containing its own source tree and no MBLINK build-time or runtime dependency.

          Current release: **0.1.0 — X400 foundation**.

          JAGLINK includes ELM327 transport/session handling, standard OBD-II, parameter storage, scheduling, telemetry/CSV, ISO-TP, UDS foundations, native iPhone and Linux front ends, and the Jaguar X400 manufacturer/network profile. Mercedes-specific code is not included.

          The X400 profile represents the source-corroborated 500 kbit/s powertrain CAN, 41.6 kbit/s SCP body network, 10.4 kbit/s ISO-9141 serial diagnostic link and D2B optical infotainment network. Proprietary Jaguar module requests remain read-only/evidence-gated until source-corroborated or vehicle-verified.

          ## Build

          ```sh
          git clone --recurse-submodules https://github.com/The-First-Infiltrator/Jaglink.git
          cd Jaglink
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ```

          Infiltratr Common 1.10.0 is pinned directly at `src/infiltratr-common`.

          ## iPhone

          The native project is `app/ios/JAGLINK.xcodeproj`. Releases publish an unsigned arm64 device IPA together with GitHub's source archives.

          ## Linux

          ```sh
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_LINUX_APP=ON
          cmake --build build-linux --target jaglink-linux --parallel
          ```

          ## Licence

          GPL-3.0-or-later.
          README

          rm -f docs/UPSTREAM.md
          cat > docs/ORIGIN.md <<'ORIGIN'
          # Fork origin

          JAGLINK began as a Jaguar-focused fork of MBLINK 0.7.12 (`e760b6ec05897c87e3531d68649b121403fcdec8`).

          That commit is provenance only. JAGLINK contains its own generic protocol source files and does not reference, clone, pin, import or compile MBLINK as part of a normal build. Infiltratr Common remains a direct shared-library submodule pinned independently at version 1.10.0.
          ORIGIN

          if grep -R --exclude='ORIGIN.md' --exclude='standalone-bootstrap.yml' -n 'upstream/mblink' CMakeLists.txt README.md app include platform src tests docs .gitmodules 2>/dev/null; then
            echo 'Found stale upstream/mblink reference.' >&2
            exit 1
          fi

          git rm .github/workflows/standalone-bootstrap.yml
          git add -- .gitmodules CMakeLists.txt README.md LICENSE app/ios/JAGLINK.xcodeproj/project.pbxproj include/mblink platform/apple src/core src/elm327 src/obd2 src/uds src/infiltratr-common tests docs/ORIGIN.md
          git add -u -- docs upstream .github/workflows/standalone-bootstrap.yml

          git diff --cached --check
          git status --short
          git commit -m 'JAGLINK 0.1.0: make repository standalone'
          git push origin HEAD:main
