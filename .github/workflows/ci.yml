name: JAGLINK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-audit:
    name: Product face / shared LINK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Jaguar face over shared LINK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gitlinks < <(git ls-files --stage | awk '$1 == "160000" { print $4 }' | sort)
          expected_gitlinks=("src/infiltratr-common" "src/link")
          if [[ "${gitlinks[*]}" != "${expected_gitlinks[*]}" ]]; then
            printf 'Unexpected gitlink dependency set:\n%s\n' "${gitlinks[*]:-<none>}" >&2
            exit 1
          fi

          test ! -e platform/windows/jaglink-discover.c
          test ! -d src/discover
          test ! -e src/core/isotp.c
          grep -Fq '#include "link/discover.h"' include/jaglink/discover.h
          grep -Fq '#include "link/isotp.h"' include/jaglink/isotp.h
          grep -q 'LINK::Core' CMakeLists.txt
          grep -q 'link_add_windows_discover(jaglink-discover' CMakeLists.txt
          grep -q 'set(JAGLINK_LINK_VERSION "0.5.0")' CMakeLists.txt
          grep -q 'set(JAGLINK_LINK_COMMIT "560a9864a93b71488ce0e71fc3757469cb512d9d")' CMakeLists.txt
          test "$(git -C src/link rev-parse HEAD)" = "560a9864a93b71488ce0e71fc3757469cb512d9d"
          grep -q 'path = ../../src/link/src/core/isotp.c' app/ios/JAGLINK.xcodeproj/project.pbxproj

          if git grep -n -I -i -E 'mercedes|mercedes-benz' -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)README.md' \
            ':(exclude)docs/**'; then
            echo 'Jaguar product source carries Mercedes-specific identity.' >&2
            exit 1
          fi

          git grep -q 'JAGLINK_VERSION' -- CMakeLists.txt include/jaglink src/core
          git grep -q 'JagLinkBLETransport' -- platform/apple app/ios

  portable-core:
    name: ${{ matrix.os }} / C11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DJAGLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure

  linux-shell:
    name: Linux / GTK4 app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --target jaglink-linux --parallel

  windows-discover:
    name: Windows / jaglink-discover Win32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Win32 J2534 build
        shell: pwsh
        run: cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_WINDOWS_DISCOVER=ON
      - name: Build discovery GUI and portable tests
        shell: pwsh
        run: cmake --build build-win32 --config Release --parallel
      - name: Run portable tests
        shell: pwsh
        run: ctest --test-dir build-win32 -C Release --output-on-failure
      - name: Stage discovery executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item build-win32/Release/jaglink-discover.exe release-assets/jaglink-discover.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-windows-discover
          path: release-assets/jaglink-discover.exe
          if-no-files-found: error
          retention-days: 30

  linux-packages:
    name: Linux / DEB + native RUN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev dpkg-dev
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
          cmake --build build-package --parallel
          mkdir -p release-assets
          cpack --config build-package/CPackConfig.cmake -G DEB -B release-assets
      - name: Build self-compiling native RUN
        shell: bash
        run: bash scripts/build-linux-run.sh release-assets
      - name: Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-linux-packages
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ios-simulator:
    name: iOS / simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          xcodebuild \
            -project app/ios/JAGLINK.xcodeproj \
            -scheme JAGLINK \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION="$version" \
            CODE_SIGNING_ALLOWED=NO \
            build

  iphone-device-ipa:
    name: iPhone / unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build unsigned physical-device IPA
        shell: bash
        run: bash scripts/build-ios-ipa.sh release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: |
            release-assets/JAGLINK-${{ steps.version.outputs.version }}-unsigned.ipa
            release-assets/JAGLINK-${{ steps.version.outputs.version }}-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [standalone-audit, portable-core, sanitizers, linux-shell, windows-discover, linux-packages, ios-simulator, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: JAGLINK-*
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;
            const assetDir = path.join(process.env.GITHUB_WORKSPACE, 'release-assets');

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== target) {
              core.info(`Skipping stale release run at ${target}; main is ${main.data.commit.sha}.`);
              return;
            }

            try {
              const tagRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (tagRef.data.object.sha !== target) {
                core.info(`${tag} already points to ${tagRef.data.object.sha}; this push is not a release commit.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: `JAGLINK ${version}`,
                body: `JAGLINK ${version} — X400 diagnostics plus read-only OpenPort 2.0/J2534 discovery. Release assets include the unsigned iPhone IPA, Linux Debian package, native self-compiling .run installer, Windows jaglink-discover executable, and checksums.`,
                draft: false,
                prerelease: false,
                generate_release_notes: true
              })).data;
            }

            const files = fs.readdirSync(assetDir).filter(name => fs.statSync(path.join(assetDir, name)).isFile());
            if (files.length === 0) throw new Error('No release assets were downloaded.');
            const existing = new Map(release.assets.map(asset => [asset.name, asset.id]));
            for (const name of files) {
              if (existing.has(name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.get(name) });
              }
              const data = fs.readFileSync(path.join(assetDir, name));
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data });
            }
