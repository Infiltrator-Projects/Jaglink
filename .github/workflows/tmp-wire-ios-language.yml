name: Temporary wire iPhone languages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-wire-ios-language.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire runtime language switching and Xcode resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app/ios/JAGLINK/JAGLINKApp.swift')
          a = app_path.read_text()
          old = 'struct JAGLINKApp: App {\n    @State private var showingAbout = false\n'
          new = 'struct JAGLINKApp: App {\n    @State private var showingAbout = false\n    @AppStorage("jaglink.language") private var language = "en"\n'
          if old not in a:
              raise SystemExit('JAGLINKApp storage marker missing')
          a = a.replace(old, new, 1)
          old = '            ContentView()\n                .preferredColorScheme(.dark)\n'
          new = '            ContentView()\n                .environment(\\.locale, Locale(identifier: language))\n                .preferredColorScheme(.dark)\n'
          if old not in a:
              raise SystemExit('JAGLINK root view marker missing')
          a = a.replace(old, new, 1)
          app_path.write_text(a)

          view_path = Path('app/ios/JAGLINK/ContentView.swift')
          s = view_path.read_text()
          s = s.replace('Text(text.uppercased())', 'Text(LocalizedStringKey(text)).textCase(.uppercase)')
          s = s.replace('Label(title, systemImage: systemImage)', 'Label(LocalizedStringKey(title), systemImage: systemImage)')
          s = s.replace('Text(title)', 'Text(LocalizedStringKey(title))')
          s = s.replace('Text(subtitle)', 'Text(LocalizedStringKey(subtitle))')
          s = s.replace('Text(label)', 'Text(LocalizedStringKey(label))')
          s = s.replace('Text(value)', 'Text(LocalizedStringKey(value))')
          s = s.replace('Text(parameter.title)', 'Text(LocalizedStringKey(parameter.title))')
          s = s.replace('Text(network.status.uppercased())', 'Text(LocalizedStringKey(network.status)).textCase(.uppercase)')
          s = s.replace('Text(model.faultScanStatusText)', 'Text(LocalizedStringKey(model.faultScanStatusText))')
          s = s.replace('.navigationTitle(title)', '.navigationTitle(LocalizedStringKey(title))')

          old = 'private struct JagSettingsView: View {\n    @ObservedObject var model: ConnectionViewModel\n'
          new = 'private struct JagSettingsView: View {\n    @ObservedObject var model: ConnectionViewModel\n    @AppStorage("jaglink.language") private var language = "en"\n'
          if old not in s:
              raise SystemExit('JagSettingsView marker missing')
          s = s.replace(old, new, 1)

          marker = '                JagPanel(title: "Application", systemImage: "gearshape.fill") {\n'
          if marker not in s:
              raise SystemExit('Jag settings Application marker missing')
          language_panel = '''                JagPanel(title: "Language", systemImage: "globe") {
                    Picker("Language", selection: $language) {
                        Text("English").tag("en")
                        Text("Deutsch").tag("de")
                        Text("Polski").tag("pl")
                    }
                    .pickerStyle(.segmented)
                }

'''
          s = s.replace(marker, language_panel + marker, 1)
          view_path.write_text(s)

          pbx_path = Path('app/ios/JAGLINK.xcodeproj/project.pbxproj')
          p = pbx_path.read_text()
          p = p.replace(
              '\t\tA00000000000000000000032 /* JAGLINK/Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000032 /* JAGLINK/Assets.xcassets */; };',
              '\t\tA00000000000000000000032 /* JAGLINK/Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000032 /* JAGLINK/Assets.xcassets */; };\n\t\tJAG10CAL0000000000000001 /* Localizable.strings in Resources */ = {isa = PBXBuildFile; fileRef = JAG10CAL0000000000000005 /* Localizable.strings */; };', 1)
          p = p.replace(
              '\t\tB00000000000000000000032 /* JAGLINK/Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = JAGLINK/Assets.xcassets; sourceTree = SOURCE_ROOT; };',
              '\t\tB00000000000000000000032 /* JAGLINK/Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = JAGLINK/Assets.xcassets; sourceTree = SOURCE_ROOT; };\n\t\tJAG10CAL0000000000000002 /* en */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = en; path = "JAGLINK/en.lproj/Localizable.strings"; sourceTree = SOURCE_ROOT; };\n\t\tJAG10CAL0000000000000003 /* de */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = de; path = "JAGLINK/de.lproj/Localizable.strings"; sourceTree = SOURCE_ROOT; };\n\t\tJAG10CAL0000000000000004 /* pl */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = pl; path = "JAGLINK/pl.lproj/Localizable.strings"; sourceTree = SOURCE_ROOT; };', 1)
          p = p.replace(
              '\t\t\t\tB00000000000000000000032 /* JAGLINK/Assets.xcassets */,\n',
              '\t\t\t\tB00000000000000000000032 /* JAGLINK/Assets.xcassets */,\n\t\t\t\tJAG10CAL0000000000000005 /* Localizable.strings */,\n', 1)
          p = p.replace(
              '/* End PBXGroup section */',
              '''/* End PBXGroup section */

/* Begin PBXVariantGroup section */
\t\tJAG10CAL0000000000000005 /* Localizable.strings */ = {
\t\t\tisa = PBXVariantGroup;
\t\t\tchildren = (
\t\t\t\tJAG10CAL0000000000000002 /* en */,
\t\t\t\tJAG10CAL0000000000000003 /* de */,
\t\t\t\tJAG10CAL0000000000000004 /* pl */,
\t\t\t);
\t\t\tname = Localizable.strings;
\t\t\tsourceTree = "<group>";
\t\t};
/* End PBXVariantGroup section */''', 1)
          p = p.replace(
              '\t\t\tknownRegions = (\n\t\t\t\ten,\n\t\t\t\tBase,\n\t\t\t);',
              '\t\t\tknownRegions = (\n\t\t\t\ten,\n\t\t\t\tde,\n\t\t\t\tpl,\n\t\t\t\tBase,\n\t\t\t);', 1)
          p = p.replace(
              '\t\t\t\tA00000000000000000000032 /* JAGLINK/Assets.xcassets in Resources */,\n',
              '\t\t\t\tA00000000000000000000032 /* JAGLINK/Assets.xcassets in Resources */,\n\t\t\t\tJAG10CAL0000000000000001 /* Localizable.strings in Resources */,\n', 1)
          pbx_path.write_text(p)
          PY

          git rm .github/workflows/tmp-wire-ios-language.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ios/JAGLINK/JAGLINKApp.swift app/ios/JAGLINK/ContentView.swift app/ios/JAGLINK.xcodeproj/project.pbxproj
          git commit -m "Wire live English German Polish iPhone UI"
          git push origin HEAD:main
