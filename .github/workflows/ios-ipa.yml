# SPDX-License-Identifier: GPL-3.0-or-later
name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: JAGLINK unsigned physical-device IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build JAGLINK-unsigned.ipa
        shell: bash
        run: bash scripts/build-ios-ipa.sh dist JAGLINK-unsigned.ipa
      - name: Upload IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-unsigned-ipa
          path: |
            dist/JAGLINK-unsigned.ipa
            dist/JAGLINK-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
