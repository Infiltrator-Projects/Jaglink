# SPDX-License-Identifier: GPL-3.0-or-later
name: JAGLINK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  LINK_VERSION: 0.7.1
  LINK_COMMIT: 4c75618da2085ecd09e8110f2883decf9b2162f9

jobs:
  standalone-audit:
    name: Product face / shared LINK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Jaguar face over shared LINK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gitlinks < <(git ls-files --stage | awk '$1 == "160000" { print $4 }' | sort)
          test "${gitlinks[*]}" = "src/link"
          test ! -e src/infiltratr-common
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "$LINK_VERSION"
          test "$(git -C src/link rev-parse HEAD)" = "$LINK_COMMIT"
          test "$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)" = "1.10.0"

          test ! -e platform/windows/jaglink-discover.c
          test ! -d src/discover
          test ! -e src/core/isotp.c
          grep -Fq '#include "link/discover.h"' include/jaglink/discover.h
          grep -Fq '#include "link/isotp.h"' include/jaglink/isotp.h
          grep -q 'LINK::Core' CMakeLists.txt
          grep -q 'link_add_windows_discover(jaglink-discover' CMakeLists.txt

          grep -q 'link_elm327_parser_feed' src/link/src/elm327/elm327.c
          grep -q 'link_elm327_can_decode_pdu' src/link/src/elm327/can.c
          grep -q 'link_elm327_probe_accept' src/link/src/elm327/probe.c
          grep -q 'link_elm327_session_begin' src/link/src/elm327/session.c
          grep -q 'return link_elm327_parser_feed' src/elm327/elm327.c
          grep -q 'return link_elm327_can_decode_pdu' src/elm327/can.c
          grep -q 'return link_elm327_probe_accept' src/elm327/probe.c
          grep -q 'return link_elm327_session_begin' src/elm327/session.c
          grep -q '../link/src/core/transport.c' src/core/jaglink.c
          grep -q '../link/src/elm327/elm327.c' src/core/jaglink.c
          grep -q '../link/src/elm327/can.c' src/core/jaglink.c
          grep -q '../link/src/elm327/probe.c' src/core/jaglink.c
          grep -q '../link/src/elm327/session.c' src/core/jaglink.c

          grep -q 'link_parameter_store_record' src/link/src/core/parameter.c
          grep -q 'link_scheduler_add_parameter' src/link/src/core/scheduler.c
          grep -q 'link_telemetry_store_record' src/link/src/core/telemetry.c
          grep -q '../link/src/core/parameter.c' src/core/jaglink.c
          grep -q '../link/src/core/scheduler.c' src/core/jaglink.c
          grep -q '../link/src/core/telemetry.c' src/core/jaglink.c

          grep -Fq 'Copyright © 2026 Xavier Wheaton and Shannon Smith' app/ios/JAGLINK.xcodeproj/project.pbxproj
          grep -Fq 'Copyright © 2026 Xavier Wheaton and Shannon Smith' app/ios/JAGLINK/JAGLINKApp.swift
          grep -Fq 'gtk_image_new_from_resource' app/linux/main.c
          ! grep -Fq 'gtk_label_new("◆")' app/linux/main.c

          if git grep -n -I -i -E 'mercedes|mercedes-benz' -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)README.md' \
            ':(exclude)docs/**'; then
            echo 'Jaguar product source carries Mercedes-specific identity.' >&2
            exit 1
          fi

  portable-core:
    name: ${{ matrix.os }} / C11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DJAGLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure

  linux-shell:
    name: Linux / GTK4 app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --target jaglink-linux --parallel
      - name: Verify Linux About and emblem
        shell: bash
        run: |
          grep -q 'jaglink_linux_show_about' app/linux/main.c
          grep -q 'gtk_image_new_from_resource' app/linux/main.c
          grep -Fq 'Xavier Wheaton' app/linux/about-dialog.c
          grep -Fq 'Shannon Smith' app/linux/about-dialog.c

  windows-discover:
    name: Windows / jaglink-discover Win32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_WINDOWS_DISCOVER=ON
      - name: Build
        shell: pwsh
        run: cmake --build build-win32 --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-win32 -C Release --output-on-failure
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item build-win32/Release/jaglink-discover.exe release-assets/jaglink-discover.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-windows-discover
          path: release-assets/jaglink-discover.exe
          if-no-files-found: error
          retention-days: 30

  linux-packages:
    name: Linux / DEB + native RUN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev dpkg-dev
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release -DJAGLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
          cmake --build build-package --parallel
          mkdir -p release-assets
          cpack --config build-package/CPackConfig.cmake -G DEB -B release-assets
      - name: Build native RUN
        shell: bash
        run: bash scripts/build-linux-run.sh release-assets
      - name: Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-linux-packages
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ios-simulator:
    name: iOS / simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          xcodebuild -project app/ios/JAGLINK.xcodeproj -scheme JAGLINK \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION="$version" CODE_SIGNING_ALLOWED=NO build

  iphone-device-ipa:
    name: iPhone / unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build unsigned physical-device IPA
        shell: bash
        run: bash scripts/build-ios-ipa.sh release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: JAGLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: |
            release-assets/JAGLINK-${{ steps.version.outputs.version }}-unsigned.ipa
            release-assets/JAGLINK-${{ steps.version.outputs.version }}-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [standalone-audit, portable-core, sanitizers, linux-shell, windows-discover, linux-packages, ios-simulator, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: JAGLINK-*
          path: release-assets
          merge-multiple: true
      - name: Create exact tag and publish assets
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'release-assets');
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== target) throw new Error(`Stale release run at ${target}; main is ${main.data.commit.sha}.`);
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.data.object.sha !== target) throw new Error(`${tag} points to ${ref.data.object.sha}, not ${target}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: target,
                name: `JAGLINK ${version}`,
                body: `JAGLINK ${version}: Jaguar X400 diagnostics on LINK 0.7.1 shared transport and ELM327 runtime.`,
                draft: false, prerelease: false, generate_release_notes: true
              })).data;
            }
            const files = fs.readdirSync(dir).filter(name => fs.statSync(path.join(dir, name)).isFile());
            if (files.length === 0) throw new Error('No release assets were downloaded.');
            const existing = new Map(release.assets.map(asset => [asset.name, asset.id]));
            for (const name of files) {
              if (existing.has(name)) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.get(name) });
              const data = fs.readFileSync(path.join(dir, name));
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data });
            }
