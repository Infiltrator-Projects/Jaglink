name: Converge JAGLINK Apple portable core

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stage-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build corrected CI copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/ci.yml')
          text = src.read_text()
          replacements = {
              "          grep -Fq '#include \"../link/src/core/diagnostic_request.c\"' src/core/jaglink.c\n          grep -Fq '#include \"../link/src/core/mercedes_me_diagnostic.c\"' src/core/jaglink.c\n          grep -Fq '#include \"../link/src/kwp2000/kwp2000.c\"' src/core/jaglink.c\n":
              "          grep -Fq '#include \"../link/platform/apple/LinkPortableCore.c\"' src/core/jaglink.c\n          ! grep -q 'LINK_APPLE_PORTABLE_CORE_EXTERNAL_' src/core/jaglink.c\n          ! grep -q 'src/link/src/core/isotp.c' app/ios/JAGLINK.xcodeproj/project.pbxproj\n          ! grep -q 'src/link/src/core/i18n.c' app/ios/JAGLINK.xcodeproj/project.pbxproj\n          ! grep -q 'src/link/src/core/i18n_platform.c' app/ios/JAGLINK.xcodeproj/project.pbxproj\n          ! grep -q 'src/link/src/core/language_pack.c' app/ios/JAGLINK.xcodeproj/project.pbxproj\n",
              "          grep -Fq '#include \"../link/src/core/diagnostic_capability.c\"' src/core/jaglink.c\n":
              "          grep -Fq '#include \"../link/platform/apple/LinkPortableCore.c\"' src/core/jaglink.c\n",
              "          grep -q 'src/core/diagnostic_flow.c' src/core/jaglink.c\n":
              "          grep -Fq '#include \"../link/platform/apple/LinkPortableCore.c\"' src/core/jaglink.c\n",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'expected CI assertion not found: {old!r}')
          out = Path('.ci/ci-patched.yml')
          out.parent.mkdir(exist_ok=True)
          out.write_text(text)
          PY
      - name: Commit staged CI blob
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add .ci/ci-patched.yml
          if git diff --cached --quiet; then
            echo 'Corrected CI blob already staged.'
            exit 0
          fi
          git commit -m 'Stage corrected JAGLINK CI blob'
          git push origin HEAD:main
