# SPDX-License-Identifier: GPL-3.0-or-later
name: Repair JAGLINK APT JSON handling once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Replace jq-only APT verification with Python stdlib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')

          old_payload = '''          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \\
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"'''
          new_payload = '''          payload="$(python3 -c 'import json, os; print(json.dumps({"event_type":"application-release","client_payload":{"repository":os.environ["GITHUB_REPOSITORY"],"sha":os.environ["RELEASE_SHA"]}}, separators=(",", ":")))')"'''

          old_check = '''            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \\
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \\
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then'''
          new_check = '''            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \\
              | python3 -c 'import json, os, sys; apps=json.load(sys.stdin); raise SystemExit(0 if any(str(app.get("id", "")) == os.environ["APP_ID"] and str(app.get("version", "")) == os.environ["VERSION"] for app in apps) else 1)'; then'''

          assert text.count(old_payload) == 1, 'unexpected jq payload block count'
          assert text.count(old_check) == 1, 'unexpected jq catalogue block count'
          text = text.replace(old_payload, new_payload).replace(old_check, new_check)
          assert 'payload="$(jq -nc' not in text
          assert '| jq -e --arg id "$APP_ID"' not in text
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/repair-apt-json-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'Make JAGLINK APT verification runner-independent'
          git push origin HEAD:main
