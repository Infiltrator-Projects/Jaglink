name: JAGLINK CI status mirror

on:
  workflow_run:
    workflows: ["JAGLINK CI"]
    types: [completed]

permissions:
  statuses: write

jobs:
  mirror:
    name: Mirror aggregate CI status
    runs-on: ubuntu-latest
    steps:
      - name: Publish commit status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion;
            const state = conclusion === 'success' ? 'success'
              : conclusion === 'cancelled' ? 'error'
              : conclusion === 'skipped' ? 'error'
              : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: run.head_sha,
              state,
              target_url: run.html_url,
              description: `JAGLINK CI run ${run.id}: ${conclusion}`.slice(0, 140),
              context: 'JAGLINK CI / aggregate'
            });
