# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot JAGLINK LINK 0.14.99 repin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-link-01499.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Repin shared LINK and release JAGLINK 0.2.69
        shell: bash
        env:
          OLD_LINK: 81c6c19a889d78c37a6b9eba53e35264a33294df
          NEW_LINK: 6827152ee41faaddd9e79e5f181ae958601c909a
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.2.68"
          grep -Fq "$OLD_LINK" src/core/jaglink.c
          grep -Fq 'MARKETING_VERSION = 0.2.68;' app/ios/JAGLINK.xcodeproj/project.pbxproj

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git -C src/link fetch origin "$NEW_LINK"
          git -C src/link checkout --detach "$NEW_LINK"
          printf '0.2.69\n' > VERSION
          sed -i "s/$OLD_LINK/$NEW_LINK/g" src/core/jaglink.c
          sed -i 's/MARKETING_VERSION = 0\.2\.68;/MARKETING_VERSION = 0.2.69;/g' app/ios/JAGLINK.xcodeproj/project.pbxproj

          git add src/link VERSION src/core/jaglink.c app/ios/JAGLINK.xcodeproj/project.pbxproj
          git rm .github/workflows/one-shot-link-01499.yml
          git diff --cached --check
          test "$(git ls-tree HEAD src/link | awk '{print $3}')" = "$OLD_LINK"
          git commit -m 'Release 0.2.69: fix simulated long live responses'
          git push origin HEAD:main
